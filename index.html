.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ink);padding:8px 14px;font:11px var(--px);z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}

.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;align-items:start}

<script>
const SC={
university:{l:'My University',i:'graduation-cap',f:[['name','University name','text',1],['platform','Learning platform (Moodle, Canvas, HEMIS…)'],['platformUrl','Platform link','url'],['portal','Student portal link','url'],['major','Major / program'],['year','Year / semester'],['gpa','Current GPA'],['notes','Notes','textarea']]},
courses:{l:'Courses & Learning',i:'book-open',s:['want to learn','planned','in progress','completed','paused'],dl:'start',p:1,f:[['name','Course name','text',1],['platform','Platform'],['instructor','Instructor'],['url','Course URL','url'],['start','Start date','date'],['notes','Notes','textarea']]},
projects:{l:'Projects',i:'folder-kanban',s:['idea','planned','in progress','completed','on hold'],dl:'due',p:1,f:[['name','Project title','text',1],['tech','Technologies'],['url','Live website','url'],['repo','GitHub repository','url'],['due','Expected completion','date'],['notes','Description & notes','textarea']]},
websites:{l:'Websites & Resources',i:'globe',sl:'Category',s:['Programming','Cybersecurity','Artificial Intelligence','Machine Learning','Research','University Research','Productivity','Design','Writing','Mathematics','Science','Business','Language Learning','Entertainment','Other'],f:[['name','Title','text',1],['url','URL','url',1],['notes','Notes','textarea']]},
notes:{l:'Notes & Research',i:'notebook-pen',f:[['name','Title','text',1],['notes','Content','textarea']]},
books:{l:'Books & Reading',i:'library',s:['want to read','reading','completed','paused'],f:[['name','Title','text',1],['author','Author'],['notes','Review & notes','textarea']]}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- local database (IndexedDB) ---------- */
const IDBP=new Promise((ok,no)=>{const r=indexedDB.open('khub',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(store,mode,fn)=>{const d=await IDBP;return new Promise((ok,no)=>{const t=d.transaction(store,mode),rq=fn(t.objectStore(store));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})};
let db=[],st={},pics={},vault=null,view='dashboard',q='',sf='',col=innerWidth<800,FL=[],lq='',skin='cyber',FH=null,FHok=false,SAVED='',PEND=null;
let CFG={status:{},fields:{}},tr={f:'Auto-detect',t:'English',i:'',o:'',b:false,e:''};
const payload=()=>({v:2,db,st,pics,vault,cfg:CFG,tr:{f:tr.f,t:tr.t},skin});
let ptm=null;
function ss(){const e=document.getElementById('sy');if(e)e.textContent=SAVED}
async function fileWrite(){if(!FH||!FHok)return;try{const w=await FH.createWritable();await w.write(JSON.stringify(payload()));await w.close()}catch(e){FHok=false;toast('Data file is not writable — reconnect it in Settings.')}}
async function flush(){clearTimeout(ptm);try{await idb('kv','readwrite',s=>s.put(payload(),'data'));SAVED='saved ✓ '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){SAVED='save error';toast('Could not save in this browser: '+(e.message||e))}ss();fileWrite()}
function persist(){SAVED='saving…';ss();clearTimeout(ptm);ptm=setTimeout(flush,350)}
const save=persist,saveSt=persist,savePic=persist,saveTr=persist;
function setSkin(k){skin=SK[k]?k:'cyber';document.documentElement.dataset.skin=skin;persist()}
function apply(d){db=(d.db||[]).filter(x=>SC[x.type]);st=d.st||{};pics=d.pics||{};vault=d.vault||null;CFG=Object.assign({status:{},fields:{}},d.cfg||{});if(d.tr){tr.f=d.tr.f||tr.f;tr.t=d.tr.t||tr.t}skin=SK[d.skin]?d.skin:'cyber';document.documentElement.dataset.skin=skin}
async function boot(){try{let d=await idb('kv','readonly',s=>s.get('data'));
if(!d){const g=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};d={db:g('kh')||[],st:g('kh-st')||{},pics:g('kh-pic')||{},tr:g('kh-tr'),skin:localStorage.getItem('kh-skin')}}
apply(d);FL=(await idb('files','readonly',s=>s.getAll())).map(({blob,...m})=>m);FH=await idb('kv','readonly',s=>s.get('fh'))||null;
if(FH){try{FHok=(await FH.queryPermission({mode:'readwrite'}))=='granted'}catch(e){FH=null}}}catch(e){toast('Storage problem: '+(e.message||e))}
SAVED='loaded ✓';render()}
const fsz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.ceil(b/1e3)+' KB';

let VT={key:null,items:[],q:'',err:'',show:{},tm:null};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vSeal(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},VT.key,new TextEncoder().encode(JSON.stringify(VT.items))));vault.iv=b64(iv);vault.ct=b64(ct);persist()}
function vkick(){clearTimeout(VT.tm);if(VT.key)VT.tm=setTimeout(()=>{VT.key=null;VT.items=[];VT.show={};if(view=='vault')render()},300000)}
const genPw=(n=18)=>{const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+?',r=crypto.getRandomValues(new Uint32Array(n));return [...r].map(v=>c[v%c.length]).join('')};
async function vSetup(f){const v=Object.fromEntries(new FormData(f));VT.err='';if(v.p!==v.p2)VT.err='The two passwords do not match.';else if(v.p.length<8)VT.err='Use at least 8 characters.';
else{const salt=crypto.getRandomValues(new Uint8Array(16));vault={salt:b64(salt)};VT.key=await dk(v.p,salt);VT.items=[];await vSeal();vkick()}render()}
async function vUnlock(f){const v=Object.fromEntries(new FormData(f));VT.err='';try{const k=await dk(v.p,unb(vault.salt)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(vault.iv)},k,unb(vault.ct));VT.items=JSON.parse(new TextDecoder().decode(pt));VT.key=k;vkick()}catch(e){VT.err='Wrong master password.'}render()}
async function vChange(f){const v=Object.fromEntries(new FormData(f));if(v.p!==v.p2||v.p.length<8){toast('Passwords must match and be 8+ characters.');return}const salt=crypto.getRandomValues(new Uint8Array(16));vault.salt=b64(salt);VT.key=await dk(v.p,salt);await vSeal();modal('');toast('Master password changed')}
